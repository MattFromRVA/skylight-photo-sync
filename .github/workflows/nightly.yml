name: Nightly

on:
  schedule:
    # 07:00 UTC daily = 03:00 US Eastern (EDT) / 02:00 US Eastern (EST).
    - cron: "0 7 * * *"
  workflow_dispatch:

# A new nightly cancels an older one that is still running.
concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS is included so the [MacOnlyFact] tests, which call sips, actually run.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -warnaserror --no-restore

      - name: Format
        run: dotnet format --verify-no-changes --no-restore

      - name: Test
        run: dotnet test --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: "**/TestResults/*.trx"
          retention-days: 14
          if-no-files-found: warn

  pack:
    name: Pack dotnet tool
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Pack
        run: dotnet pack src/SkylightPhotoSync -c Release -o artifacts

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: skylight-sync-nightly
          path: artifacts/*.nupkg
          retention-days: 14
          if-no-files-found: error

  report-failure:
    name: Open or update failure issue
    # Only the scheduled run reports; a manual dispatch is watched by whoever started it.
    if: failure() && github.event_name == 'schedule'
    needs: [build-test, pack]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = "Nightly build failed";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The scheduled nightly build failed on ${new Date().toISOString().slice(0, 10)}: ${runUrl}`;

            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = open.find((issue) => issue.title === title && !issue.pull_request);

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              core.info(`Commented on existing issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `${body}\n\nThis issue is reused by later failing nightlies; close it once the build is green again.`,
              });
              core.info(`Opened issue #${created.data.number}`);
            }
